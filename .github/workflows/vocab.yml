name: Send Vocabulary to Telegram

on:
  schedule:
    # Chạy mỗi 2 tiếng, CHỈ trong khung giờ 7:00 - 21:00 giờ Việt Nam (UTC+7),
    # tức 00:00 - 14:00 giờ UTC. GitHub có thể trễ vài phút khi hệ thống bận.
    - cron: "0 0,2,4,6,8,10,12,14 * * *"
  workflow_dispatch: {}  # cho phép bấm "Run workflow" để chạy thử thủ công

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send vocabulary
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python send_vocab.py
